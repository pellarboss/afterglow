<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if page.title and page.url != "/" %}{% assign full_title = page.title | append: " | " | append: site.title %}{% else %}{% assign full_title = site.title | append: ": your Hue light, without the bridge" %}{% endif %}
<title>{{ full_title }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
<meta name="theme-color" content="#1C1729">
<meta property="og:title" content="{{ full_title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/img/app_icon.png' | absolute_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" type="image/png" href="{{ '/assets/img/app_icon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/app_icon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Young+Serif&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
